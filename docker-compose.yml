version: "3.8"

services:
  dog-breed-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dog-breed-classifier-service
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
      - DEVICE=cpu
      - MODEL_PATH=dog_breed_model.h5
      - CLASSES_PATH=classes.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
